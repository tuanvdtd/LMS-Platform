# Piston chạy code học viên. Dev: docker compose -f piston/docker-compose.yml up -d
# - API chạy TRONG Docker cùng network với Piston: bỏ `ports`, gọi http://piston:2000. Không mở cổng 2000 ra ngoài.
# - API chạy trên host (pnpm start:dev): giữ `127.0.0.1:2000:2000` (không bao giờ `0.0.0.0`), PISTON_URL=http://127.0.0.1:2000.
services:
  piston:
    # Pin theo digest — đổi digest khi muốn nâng Piston; hành vi response có thể đổi.
    image: ghcr.io/engineer-man/piston@sha256:2f66b7456189c4d713aa986d98eccd0b6ee16d26c7ec5f21b30e942756fd127a
    # Image đã pin dùng AMD64; Mac Apple Silicon chạy qua giả lập.
    platform: linux/amd64
    restart: unless-stopped
    # Piston bắt buộc (isolate/cgroup). Sandbox thủng = root trên host → prod có người dùng thật tách EC2 riêng.
    privileged: true
    ports:
      - 127.0.0.1:2000:2000
    cpus: 1
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 512
    environment:
      # 2 job × 256 MB (mốc bộ nhớ cố định ở code-runner.ts) ≈ nửa trần 1 GB của container.
      PISTON_MAX_CONCURRENT_JOBS: 2
      # ≥ wall lớn nhất API gửi: Python 6000 ms CPU × 2. Thấp hơn → Piston trả 400 "run_timeout cannot exceed…".
      PISTON_RUN_TIMEOUT: 12000
      PISTON_RUN_CPU_TIME: 10000
      PISTON_OUTPUT_MAX_SIZE: 65536
      PISTON_DISABLE_NETWORKING: 'true'
    volumes:
      - packages:/piston/packages
    tmpfs:
      - /tmp:exec
volumes:
  packages:
